<!DOCTYPE html>
<html lang="en">

<head>
  <!-- <style>
        head {
          background-image: url('%PUBLIC_URL%/images/assets/wood-texture.jpg');
        }
      </style> -->
  <meta charset="utf-8" />
  <link rel="shortcut icon" href="favicon.ico" />
  <meta name="viewport" content="minimum-scale=1, initial-scale=1, width=device-width" />
  <meta name="theme-color" content="#000000" />
  <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
      -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
      -->
  <title>King of the Dice</title>
  <!-- Fonts to support Material Design -->
  <style>
    /* width */
    ::-webkit-scrollbar {
      width: 0.3vw;
    }

    /* Track */
    ::-webkit-scrollbar-track {
      background: #00000000;
    }

    /* Handle */
    ::-webkit-scrollbar-thumb {
      background: #cc6644;
    }


    @font-face {
      font-family: 'font1';
      src: url('./open-sans-condensed.bold.ttf') format('embedded-opentype'),
        url('./open-sans-condensed.bold.ttf') format('woff2'),
        url('./open-sans-condensed.bold.ttf') format('woff'),
        url('./open-sans-condensed.bold.ttf') format('truetype'),
        url('./open-sans-condensed.bold.ttf') format('svg');
    }

    input[type=range] {
      height: 1vw;
      -webkit-appearance: none;
      margin: 0.3vw 0;
      width: 100%;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 0.5vw;
      cursor: pointer;
      box-shadow: 0.05vw 0.05vw 0.05vw #000000;
      background: #74A9D8;
      border-radius: 0.1vw;
      border: 0vw solid #010101;
      
    }

    input[type=range]::-webkit-slider-thumb {
      box-shadow: 0.05vw 0.05vw 0.05vw #000031;
      border: 0.1vw solid #00001E;
      height: 1vw;
      width: 1vw;
      border-radius: 0.78vw;
      background: linear-gradient(to bottom, #ff9900 0%, #993300 100%);
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -0.3vw;
    }

    input[type=range]:focus::-webkit-slider-runnable-track {
      background: #74A9D8;
    }

    input[type=range]::-moz-range-track {
      width: 100%;
      height: 0.5vw;
      cursor: pointer;
      box-shadow: 0.05vw 0.05vw 0.05vw #000000;
      background: #74A9D8;
      border-radius: 0.1vw;
      border: 0vw solid #010101;
    }

    input[type=range]::-moz-range-thumb {
      box-shadow: 0.05vw 0.05vw 0.05vw #000031;
      border: 0.1vw solid #00001E;
      height: 1vw;
      width: 1vw;
      border-radius: 0.78vw;
      background: linear-gradient(to bottom, #ff9900 0%, #993300 100%);
      cursor: pointer;
      margin-top: -0.3vw;
    }

    input[type=range]::-ms-track {
      width: 100%;
      height: 0.5vw;
      cursor: pointer;
      animate: 0.2s;
      background: transparent;
      border-color: transparent;
      color: transparent;
    }

    input[type=range]::-ms-fill-lower {
      background: #74A9D8;
      border: 0vw solid #010101;
      border-radius: 0.10vw;
      box-shadow: 0.05vw 0.05vw 0.05vw #000000;
    }

    input[type=range]::-ms-fill-upper {
      background: #74A9D8;
      border: 0vw solid #010101;
      border-radius: 0.10vw;
      box-shadow: 0.05vw 0.05vw 0.05vw #000000;
    }

    input[type=range]::-ms-thumb {
      box-shadow: 0.05vw 0.05vw 0.05vw #000031;
      border: 0.1vw solid #00001E;
      height: 1vw;
      width: 1vw;
      border-radius: 0.78vw;
      background: linear-gradient(to bottom, #ff9900 0%, #993300 100%);
      cursor: pointer;
      margin-top: -0.3vw;
    }

    input[type=range]:focus::-ms-fill-lower {
      background: #74A9D8;
    }

    input[type=range]:focus::-ms-fill-upper {
      background: #74A9D8;
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
